name: Import ESP32 firmware backend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-esp32-firmware.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout backend source matching uploaded ZIP
        uses: actions/checkout@v4
        with:
          repository: wpv10barza/esp32-firmware-backend-
          ref: main
          path: backend-source

      - name: Import backend files and merge panel firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p backend contract e2e include site scripts test tests
          cp -a backend-source/backend/. backend/
          cp -a backend-source/contract/. contract/
          cp -a backend-source/e2e/. e2e/
          cp -a backend-source/include/. include/
          cp -a backend-source/site/. site/
          cp -a backend-source/scripts/. scripts/
          cp -a backend-source/test/command_buffer_regression.py test/
          cp -a backend-source/test/command_text_viewport_test.cpp test/
          cp -a backend-source/test/test_command_buffer.cpp test/
          cp -a backend-source/test/virtual_keyboard_hit_test.cpp test/
          cp -a backend-source/tests/test_command_buffer_native.cpp tests/
          cp -a backend-source/tests/test_command_editor_integration.py tests/
          cp -a backend-source/tests/test_device_api_e2e.py tests/
          cp -a backend-source/tests/test_panel_state_contract.py tests/
          cp -a backend-source/tests/test_wifi_source.py tests/

          mkdir -p platformio/src/panel_4848s040
          cp backend-source/src/main.cpp platformio/src/panel_4848s040/main.cpp
          cp backend-source/include/*.h platformio/src/panel_4848s040/

          cat >> .gitignore <<'EOF'

# ESP32 firmware backend imports
include/local_config.h
*.bin
*.elf
*.map
credentials.json
.env
EOF
          sort -u .gitignore -o .gitignore

      - name: Merge PlatformIO environments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("platformio.ini")
          text = p.read_text()
          text = text.replace("default_envs = native", "default_envs = native, panel_4848s040")

          if "[env:panel_4848s040]" not in text:
              text += r'''

[env:panel_4848s040]
platform = espressif32@6.8.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -D BOARD_PANEL_4848S040=1
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=3
build_src_filter =
  +<panel_4848s040/**>
lib_deps =
  moononournation/GFX Library for Arduino@1.5.9
  lvgl/lvgl@8.4.0
'''
          p.write_text(text)
          PY

      - name: Merge README without losing LVGL documentation
        run: |
          if ! grep -q "## ESP32 firmware backend 3C" README.md; then
            cp README.md .README.guition-backup.md
            {
              cat .README.guition-backup.md
              printf '\n\n---\n\n'
              printf '%s\n\n' '## ESP32 firmware backend 3C'
              cat backend-source/README.md
            } > README.md
            rm .README.guition-backup.md
          fi

      - name: Remove temporary checkout
        run: rm -rf backend-source

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate ESP32 firmware backend 3C with LVGL panel"
          git push origin HEAD:main
