name: Mirror source repository

on:
  push:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 --branch 2026.8.2 https://github.com/alaltitov/Guition-ESP32-S3-4848S040.git "${RUNNER_TEMP}/source"

      - name: Replace target tree with source tree
        run: |
          rsync -a --delete --exclude=".git/" "${RUNNER_TEMP}/source/" "./"

      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Mirror alaltitov/Guition-ESP32-S3-4848S040 @ 2026.8.2"
          git push origin HEAD:main
