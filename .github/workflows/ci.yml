name: Firmware and API CI

on:
  push:
  pull_request:

concurrency:
  group: firmware-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-tests:
    name: PlatformIO native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run standalone native component tests
        run: |
          set -euo pipefail
          mkdir -p .ci/bin
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_command_buffer_native.cpp -o .ci/bin/command_buffer_native
          .ci/bin/command_buffer_native
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/test_command_text_viewport/test_main.cpp -o .ci/bin/command_text_viewport_test
          .ci/bin/command_text_viewport_test
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/test_virtual_keyboard/test_main.cpp -o .ci/bin/virtual_keyboard_hit_test
          .ci/bin/virtual_keyboard_hit_test
          python test/command_buffer_regression.py

  esp32-build:
    name: PlatformIO ESP32-S3 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ESP32-S3 firmware
        run: pio run -e panel_4848s040

  api-e2e:
    name: Device API E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python contract tests
        run: |
          set -euo pipefail
          python tests/test_panel_state_contract.py
          python tests/test_wifi_source.py
          python tests/test_command_editor_integration.py

      - name: Note about real Monitor E2E
        run: |
          echo "Real Monitor device/API E2E is executed by .github/workflows/firmware-and-pages.yml"
          echo "This CI job intentionally does not contact localhost:3000 without starting the real Monitor."
