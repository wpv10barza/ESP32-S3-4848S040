[platformio]
default_envs = native
src_dir = platformio/src
test_dir = test

[env:native]
platform = native
build_type = debug
test_framework = unity
test_build_src = true
lib_ldf_mode = chain
build_flags =
  -std=c++17
  -Iplatformio/src

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=c++17
  -DCORE_DEBUG_LEVEL=3
  -DDEVICE_API_BASE_URL="http://127.0.0.1:8000"
  -DWIFI_SSID="CHANGE_ME"
  -DWIFI_PASSWORD="CHANGE_ME"
lib_ldf_mode = chain
